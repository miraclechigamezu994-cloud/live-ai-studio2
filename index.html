<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live AI Studio</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#08090d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid #242630;
}

.logo{
    font-size:27px;
    font-weight:800;
}

.subtitle{
    margin-top:7px;
    color:#999;
    font-size:13px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.videoBox{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#14161d;
    border:1px solid #292c35;
    border-radius:18px;
    overflow:hidden;
}

video,
canvas{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.boxTitle{
    position:absolute;
    top:12px;
    left:12px;
    z-index:10;
    padding:7px 11px;
    background:rgba(0,0,0,.65);
    border-radius:20px;
    font-size:12px;
}

.controls{
    margin-top:16px;
    padding:18px;
    border:1px solid #292c35;
    border-radius:18px;
    background:#12141a;
}

button{
    display:inline-block;
    padding:12px 16px;
    margin:4px;
    border:0;
    border-radius:11px;
    background:#292c35;
    color:white;
    font-size:14px;
    cursor:pointer;
}

button:hover{
    background:#3a3e49;
}

.start{
    background:white;
    color:#000;
    font-weight:bold;
}

.status{
    margin-top:14px;
    padding:12px;
    border-radius:10px;
    background:#0b0d12;
    color:#aaa;
    font-size:13px;
}

.assets{
    display:flex;
    gap:12px;
    margin-top:15px;
}

.asset{
    width:75px;
    height:75px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #30333d;
    display:none;
}

.asset img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.features{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:18px;
}

.feature{
    padding:14px;
    background:#12141a;
    border:1px solid #292c35;
    border-radius:12px;
    text-align:center;
    font-size:12px;
    color:#aaa;
}

.feature strong{
    display:block;
    color:#fff;
    margin-bottom:5px;
}

@media(max-width:700px){

    .preview{
        grid-template-columns:1fr;
    }

    .features{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        ✦ Live AI Studio
    </div>

    <div class="subtitle">
        Real-time camera transformation studio
    </div>

</header>


<div class="container">

    <div class="preview">

        <div class="videoBox">

            <div class="boxTitle">
                ORIGINAL CAMERA
            </div>

            <video
                id="camera"
                autoplay
                muted
                playsinline>
            </video>

        </div>


        <div class="videoBox">

            <div class="boxTitle">
                AI OUTPUT
            </div>

            <canvas id="output"></canvas>

        </div>

    </div>


    <div class="controls">

        <button
            type="button"
            id="startCamera"
            class="start">

            📷 Start Camera

        </button>


        <button
            type="button"
            id="chooseFace">

            👤 Choose Face

        </button>


        <input
            id="faceInput"
            type="file"
            accept="image/*"
            style="display:none;">


        <button
            type="button"
            id="chooseBackground">

            🖼️ Choose Background

        </button>


        <input
            id="backgroundInput"
            type="file"
            accept="image/*"
            style="display:none;">


        <button
            type="button"
            id="removeBackground">

            Remove Background

        </button>


        <div class="assets">

            <div
                class="asset"
                id="faceAsset">

                <img
                    id="facePreview"
                    alt="Selected face">

            </div>


            <div
                class="asset"
                id="backgroundAsset">

                <img
                    id="backgroundPreview"
                    alt="Selected background">

            </div>

        </div>


        <div
            class="status"
            id="status">

            Ready.

        </div>

    </div>


    <div class="features">

        <div class="feature">

            <strong>📷 Camera</strong>

            Live camera access

        </div>


        <div class="feature">

            <strong>👤 Face</strong>

            AI face tracking

        </div>


        <div class="feature">

            <strong>🕺 Motion</strong>

            Real-time movement

        </div>


        <div class="feature">

            <strong>🖼️ Background</strong>

            Image background

        </div>

    </div>

</div>


<!-- =========================================
     ONNX RUNTIME
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>


<!-- =========================================
     LIVE AI STUDIO ENGINE
========================================= -->

<script src="./swap-engine.js"></script>


<!-- =========================================
     CAMERA + FACE CONTROLLER
========================================= -->

<script src="./face-ai.js"></script>


</body>
              </html>
